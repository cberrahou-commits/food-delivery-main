      - name: 📋 Préparation du fichier APK Standalone
        run: |
          mkdir -p output-apks
          if ls driver-app/android/app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            cp driver-app/android/app/build/outputs/apk/release/*.apk output-apks/Wajbati-Livreur.apk
          else
            find driver-app/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output-apks/Wajbati-Livreur.apk \;
          fi
          ls -lh output-apks/

      - name: 🚀 Téléchargement de l'APK (Artifact GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: Wajbati-Livreur-APK
