name: Build Android APKs

on:
  workflow_dispatch:
    inputs:
      target_app:
        description: 'Quelle application souhaitez-vous compiler ?'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - user-side
          - driver-app

jobs:
  build-user-apk:
    name: Build APK Client & Cuisinier
    if: inputs.target_app == 'all' || inputs.target_app == 'user-side'
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: ☕ Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📱 Acceptation des licences Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: 📦 Installation des dépendances (user-side)
        run: |
          cd user-side
          npm install --legacy-peer-deps

      - name: ⚙️ Génération du projet natif Android (Expo Prebuild)
        run: |
          cd user-side
          npx expo prebuild -p android --clean

      - name: ⚡ Optimisation du Gradle Wrapper (Timeout & Taille)
        run: |
          cd user-side/android
          # 1. Remplacer -all.zip par -bin.zip (55 Mo au lieu de 135 Mo = téléchargement 2.5x plus rapide)
          sed -i 's/-all.zip/-bin.zip/g' gradle/wrapper/gradle-wrapper.properties || true
          # 2. Augmenter le timeout réseau du wrapper de 10s par défaut à 120s
          if ! grep -q "networkTimeout=" gradle/wrapper/gradle-wrapper.properties; then
            echo "networkTimeout=120000" >> gradle/wrapper/gradle-wrapper.properties
          fi
          cat gradle/wrapper/gradle-wrapper.properties

      - name: 🐘 Configuration de Gradle avec Cache GitHub
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: user-side/android
          cache-read-only: false

      - name: 🔨 Compilation de l'APK Android Standalone avec Gradle
        run: |
          cd user-side/android
          chmod +x gradlew
          # Télécharger le wrapper avec jusqu'à 3 tentatives en cas de fluctuation réseau
          for i in 1 2 3; do
            echo "Tentative $i d'initialisation du Gradle Wrapper..."
            ./gradlew --version && break || (echo "Échec tentative $i, nouvelle tentative dans 5 secondes..." && sleep 5)
          done
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📋 Préparation du fichier APK Standalone
        run: |
          mkdir -p output-apks
          if ls user-side/android/app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            cp user-side/android/app/build/outputs/apk/release/*.apk output-apks/Wajbati-Client-Cuisinier.apk
          else
            find user-side/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output-apks/Wajbati-Client-Cuisinier.apk \;
          fi
          ls -lh output-apks/

      - name: 🚀 Téléchargement de l'APK (Artifact GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: Wajbati-Client-Cuisinier-APK
          path: output-apks/Wajbati-Client-Cuisinier.apk
          retention-days: 14

  build-driver-apk:
    name: Build APK Livreur Partenaire
    if: inputs.target_app == 'all' || inputs.target_app == 'driver-app'
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: ☕ Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📱 Acceptation des licences Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: 📦 Installation des dépendances (driver-app)
        run: |
          cd driver-app
          npm install --legacy-peer-deps

      - name: ⚙️ Génération du projet natif Android (Expo Prebuild)
        run: |
          cd driver-app
          npx expo prebuild -p android --clean

      - name: ⚡ Optimisation du Gradle Wrapper (Timeout & Taille)
        run: |
          cd driver-app/android
          # 1. Remplacer -all.zip par -bin.zip (55 Mo au lieu de 135 Mo = téléchargement 2.5x plus rapide)
          sed -i 's/-all.zip/-bin.zip/g' gradle/wrapper/gradle-wrapper.properties || true
          # 2. Augmenter le timeout réseau du wrapper de 10s par défaut à 120s
          if ! grep -q "networkTimeout=" gradle/wrapper/gradle-wrapper.properties; then
            echo "networkTimeout=120000" >> gradle/wrapper/gradle-wrapper.properties
          fi
          cat gradle/wrapper/gradle-wrapper.properties

      - name: 🐘 Configuration de Gradle avec Cache GitHub
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: driver-app/android
          cache-read-only: false

      - name: 🔨 Compilation de l'APK Android Standalone avec Gradle
        run: |
          cd driver-app/android
          chmod +x gradlew
          # Télécharger le wrapper avec jusqu'à 3 tentatives en cas de fluctuation réseau
          for i in 1 2 3; do
            echo "Tentative $i d'initialisation du Gradle Wrapper..."
            ./gradlew --version && break || (echo "Échec tentative $i, nouvelle tentative dans 5 secondes..." && sleep 5)
          done
